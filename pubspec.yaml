name: study_for_ever
description: "A new Flutter project with glass style design and Firebase authentication."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Dependencies
  cupertino_icons: ^1.0.9
  glassmorphism: ^3.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1

  # State Management
  flutter_bloc: ^8.1.3
  flutter_hooks: ^0.21.3+1
  equatable: ^2.1.0
  dartz: ^0.10.1

  # Localization
  easy_localization: ^3.0.8

  # Network
  connectivity_plus: ^7.3.1

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5

  # Dependency Injection
  get_it: ^9.2.1

  # Local Storage
  shared_preferences: ^2.5.5
  sqflite:
  path_provider: ^2.1.6

  # Utilities
  intl:
  uuid: ^4.6.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Regular.ttf
        - asset: assets/fonts/NotoKufiArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700
